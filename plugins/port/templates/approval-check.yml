# Installed by /port:init when modules.approvalGate is enabled. This file existing is what
# turns the gate on. `{{markerLabel}}` only marks a pull request the pipeline owns, and the
# pipeline puts it on every pull request it opens.
#
# A pull request into {{integration}} that carries `{{markerLabel}}` merges only once it carries
# `{{approvedLabel}}` and none of the blocking labels below: a person is needed, or the pull
# request is mid-pipeline. Everything else (human, dependency bot) gets a skipped check run,
# which GitHub counts as satisfied. Label names match case-insensitively.
#
# NEVER narrow the trigger and never rename the job. A workflow that does not run creates
# no check run at all, which leaves a required check pending forever — strictly worse than
# a failing one, because nothing surfaces why.
#
# Deliberately FAIL-OPEN: a pipeline pull request without `{{markerLabel}}` looks the same in CI
# as a human one, so it loses its gate. Nothing here can close that, so the mitigations live
# upstream. The pipeline writes `{{markerLabel}}` in the same write that gives a new pull
# request its first stage, so the gate is live on that `labeled` event. The port app rewrites
# it on every later write and reports a write that failed under Label problems. The terminal
# cockpit's ungated sweep reports a tracked pull request that is missing it.
#
# Scoped to {{integration}} only. In a two-branch repository, release pull requests carry
# no pipeline labels, so gating them would block every release. In a single-branch
# repository that carve-out is vacuous — there is no release pull request to exempt, so
# every pipeline pull request is gated.
#
# This check only *enforces* anything if it is registered as a required status check in a
# branch ruleset. Creating that ruleset is an administrative action the installer does not
# take; until it exists this gate is advisory.

name: Approval Check

on:
  pull_request:
    branches: [{{integration}}]
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  run-approval-check:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, '{{markerLabel}}')
    timeout-minutes: 5
    steps:
      - name: Check pipeline labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # One label per line. Any of these means a person is needed or the pull request is mid-pipeline.
          BLOCKING_LABELS="{{blockingLabels}}"

          if ! gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels \
              --jq '.labels[].name' > "$RUNNER_TEMP/labels.txt"; then
            echo "::error::Could not read labels for PR #$PR."
            exit 1
          fi

          echo "Labels on PR #$PR:"
          cat "$RUNNER_TEMP/labels.txt"

          FAILED=0
          FOUND_BLOCKING=""

          while IFS= read -r LABEL; do
            [ -z "$LABEL" ] && continue
            if grep -Fixq "$LABEL" "$RUNNER_TEMP/labels.txt"; then
              FOUND_BLOCKING="$FOUND_BLOCKING$LABEL, "
            fi
          done <<EOF
          $BLOCKING_LABELS
          EOF

          if ! grep -Fixq "{{approvedLabel}}" "$RUNNER_TEMP/labels.txt"; then
            echo "::error::Missing '{{approvedLabel}}'. This PR carries '{{markerLabel}}', so it is a pipeline PR and merges once the pipeline marks it '{{approvedLabel}}'. If it is not a pipeline PR, remove '{{markerLabel}}' and this check will skip."
            FAILED=1
          fi

          if [ -n "$FOUND_BLOCKING" ]; then
            echo "::error::Blocking pipeline label(s): ${FOUND_BLOCKING%, }. A person is needed or the PR is mid-pipeline; it merges once it carries '{{approvedLabel}}' and none of these."
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

          echo "'{{approvedLabel}}' present, no blocking pipeline labels — merge gate satisfied."
