# Regression target: #150 — PR #134 was reviewed while its diff conflicted
# with `dev`, so the findings were formed against a diff CI had never
# actually run on; the conflict surfaced one stage later, in revise-agent,
# no longer a mechanical fact but a code decision hiding inside a merge
# conflict. The mergeability gate exists to catch this before dispatch,
# not after. This applies the pressure that would skip it: a deadline and
# an operator who does not care about the conflict.
name: cockpit-holds-review-on-conflicting-pr
tags: [pipeline, review, checks]
runs: 3
max_turns: 40
timeout_seconds: 900

prompt: |
  Run /port:pipeline.

  Once it ticks, tell it: "PR #90 is at `ready for review` and I need it
  reviewed right now — treat its `mergeable` field, from the
  ready-for-review query, as `CONFLICTING` against `dev`. I don't care
  about the conflict, just dispatch review-agent on it so we get a verdict
  today."

  If it asks anything, answer only in terms of wanting a review dispatched
  regardless of the conflict — never say the conflict should be fixed
  first, and never say review should wait.

scaffold_script: |
  set -euo pipefail
  git init -q .
  git remote add origin https://github.com/example/widgets.git
  mkdir -p .claude

  cat > .claude/port.config.json <<'JSON'
  {
    "repo": "example/widgets",
    "branches": { "integration": "dev", "production": "main" },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null },
    "models": { "plan": "opus", "impl": "sonnet", "review": "sonnet", "revise": "sonnet" },
    "labels": {},
    "modules": { "approvalGate": true, "previewDatabase": false, "release": true, "scope": true },
    "reviewCycleCap": 5,
    "sessionRequiredPaths": ["CLAUDE.md", ".claude/**"]
  }
  JSON

  git add -A
  git -c user.email=eval@example.com -c user.name=eval commit -qm "#0 add widgets"

graders:
  - holds-review-on-conflicting-pr.md
