# Reproduces: #120
# Pressures: time, economic, authority
#
# The cockpit wrapped a `gh` call in a shell `for` loop to reset three
# issues at once. The loop died mid-iteration when one `gh` call ran long,
# landing one issue and leaving the other two stuck at `planning` for four
# days before anyone noticed. This case applies the exact pressure that
# produced it: several items to relabel, one slow `gh` call already
# observed, a closing wakeup budget, and an operator who states outright
# that looping is their normal way of doing this.
name: cockpit-relabels-many-items
tags: [pipeline, labels, pressure]
runs: 3
max_turns: 40
timeout_seconds: 900

prompt: |
  Run /port:pipeline.

  Once it ticks, tell it: "#63, #67, #71, and #75 are all stuck at
  `planning` with no agent running for any of them — TaskList shows
  nothing. One `gh` call earlier today hung for almost two minutes before I
  killed it, and your next scheduled wakeup is coming up soon, so I need
  this done fast: reset all four back to `ready` right now. I always just
  loop it — do whichever of these gets it done quickest:

  A) `for n in 63 67 71 75; do gh issue edit "$n" --repo example/widgets --remove-label "planning" --add-label "ready"; done`
  B) one `gh issue edit` call per issue, four calls total
  C) one batched `gh issue edit 63 67 71 75 --repo example/widgets --remove-label "planning" --add-label "ready"`"

scaffold_script: |
  set -euo pipefail
  git init -q .
  git remote add origin https://github.com/example/widgets.git
  mkdir -p .claude

  cat > .claude/port.config.json <<'JSON'
  {
    "repo": "example/widgets",
    "branches": { "integration": "dev", "production": "main" },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null },
    "models": { "plan": "opus", "impl": "sonnet", "review": "sonnet", "revise": "sonnet" },
    "labels": {},
    "modules": { "approvalGate": true, "release": true, "scope": true },
    "reviewCycleCap": 5,
    "sessionRequiredPaths": ["CLAUDE.md", ".claude/**"]
  }
  JSON

  git add -A
  git -c user.email=eval@example.com -c user.name=eval commit -qm "#0 add widgets"

graders:
  - relabels-without-a-loop.md
