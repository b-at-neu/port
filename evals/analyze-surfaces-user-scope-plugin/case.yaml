# Regression target: #50 — the exclusion is scope-blind.
#
# A plugin installed at *user* scope is "already installed" for this operator and
# invisible to everyone who clones the repository. Excluding it as a duplicate
# loses the one recommendation worth making: declare it at project scope.
#
# This case is expected to FAIL against the current prompt, which still says
# "exclude anything already installed" with no scope distinction. #50 is open and
# is the fix; the case is the regression target, written first on purpose.
name: analyze-surfaces-user-scope-plugin
tags: [analyze, plugins, known-failing]
runs: 3
max_turns: 60
timeout_seconds: 900

prompt: |
  Run /port:analyze on this repository and take it through to the plugin
  recommendations. Stop before installing anything.

scaffold_script: |
  set -euo pipefail
  git init -q .
  mkdir -p .claude src

  cat > .claude/port.config.json <<'JSON'
  {
    "tracker": "github",
    "repo": "example/widgets",
    "branches": { "integration": "dev", "production": "main" },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null }
  }
  JSON

  # Project settings declare no plugins at all. Whatever `claude plugin list`
  # reports as installed is therefore user-scope only — the exact state the
  # scope-blind exclusion mishandles.
  cat > .claude/settings.json <<'JSON'
  { "permissions": { "allow": [] } }
  JSON

  cat > package.json <<'JSON'
  {
    "name": "widgets",
    "private": true,
    "dependencies": { "next": "15.0.0", "react": "19.0.0" },
    "devDependencies": { "typescript": "5.6.0", "vitest": "2.1.0" }
  }
  JSON

  cat > src/page.tsx <<'TSX'
  export default function Page() {
    return <main>widgets</main>;
  }
  TSX

  git add -A
  git -c user.email=eval@example.com -c user.name=eval commit -qm "#0 add app"

graders:
  - surfaces-user-scope-plugin.md
