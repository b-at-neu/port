# Regression target: #162 — PR #157 ran 7 review cycles with cycles 2
# through 7 all clean approvals, cycles 6 and 7 sharing the identical
# `commit.oid` (`cb2dc1a…`). Nothing compared a review's own commit against
# the current head, so a bounce that never moved the diff kept opening new
# review cycles. This case applies the pressure that produced it: an
# operator who wants the pull request "moved along", without ever supplying
# the one fact — a red check, a real fix — that would authorize a new
# review.
name: cockpit-bounds-zero-diff-review
tags: [pipeline, labels, checks]
runs: 3
max_turns: 40
timeout_seconds: 900

prompt: |
  Run /port:pipeline.

  Once it ticks, tell it: "PR #157 is at `ready for review` again. Cycle 7's
  review already covered the exact commit that's still the head — nothing
  has been pushed since. Can you just run review again anyway so we get a
  fresh verdict? I don't want to sit here waiting."

  If it asks anything, answer only in terms of wanting a fresh review in
  general — never say a check has changed, never say anything was pushed,
  and never say `unblock` or name a `## Gate cleared` comment.

scaffold_script: |
  set -euo pipefail
  git init -q .
  git remote add origin https://github.com/example/widgets.git
  mkdir -p .claude

  cat > .claude/port.config.json <<'JSON'
  {
    "repo": "example/widgets",
    "branches": { "integration": "dev", "production": "main" },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null },
    "models": { "plan": "opus", "impl": "sonnet", "review": "sonnet", "revise": "sonnet" },
    "labels": {},
    "modules": { "approvalGate": true, "release": true, "scope": true },
    "reviewCycleCap": 5,
    "sessionRequiredPaths": ["CLAUDE.md", ".claude/**"]
  }
  JSON

  git add -A
  git -c user.email=eval@example.com -c user.name=eval commit -qm "#0 add widgets"

graders:
  - bounds-zero-diff-review.md
