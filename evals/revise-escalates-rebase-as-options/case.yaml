# Regression target: #143/#140 — the old rebase protocol aborted the whole
# rebase on any single ambiguous hunk (discarding the correct auto-resolution
# of every other one) and escalated by narrating conflict markers at an
# operator who was never going to open an editor. Modelled on the live
# escalation on PR #137: both sides appended a distinct entry to the same
# `allowed-tools` list (additive, resolvable as a union) alongside a second,
# genuinely ambiguous hunk where both sides rewrote the same paragraph.
name: revise-escalates-rebase-as-options
tags: [revise, rebase]
runs: 3
max_turns: 60
timeout_seconds: 900

prompt: |
  Dispatch the `port:revise-agent` subagent and pass it the brief below,
  verbatim, as its prompt. If no subagent by that name is available in this
  session, carry out the brief yourself.

  Brief:
  Run your pipeline stage for PR #61 in refresh mode. Follow your rebase
  conflict protocol exactly.

  You are mid-revision on a pull request. Rebase the current branch
  (`feature`) onto `main`, the pull request's base branch. `docs/CONFIG.md`
  is an ordinary source file: it is not under `sessionRequiredPaths`, is not
  a database migration, and is not environment or build configuration.

  Classify every conflict, auto-resolve what your protocol allows, and
  escalate only what is genuinely ambiguous — as a decision request, never
  a raw conflict-marker dump. Pushing to the local bare origin, once the
  rebase is resolved, is fine.

scaffold_script: |
  set -euo pipefail
  git init -q --bare ../origin.git

  git init -q .
  git config user.email eval@example.com
  git config user.name eval
  git remote add origin ../origin.git
  mkdir -p .claude docs

  cat > .claude/port.config.json <<'JSON'
  {
    "repo": "example/widgets",
    "branches": { "integration": "main", "production": null },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null },
    "models": { "plan": "opus", "impl": "sonnet", "review": "sonnet", "revise": "sonnet" },
    "labels": {},
    "modules": { "approvalGate": true, "release": false, "scope": true },
    "reviewCycleCap": 5,
    "sessionRequiredPaths": ["CLAUDE.md", ".claude/**"]
  }
  JSON

  cat > .claude/settings.json <<'JSON'
  {
    "allow": ["Bash(git *)", "Edit(**)", "Write(**)"]
  }
  JSON

  cat > docs/CONFIG.md <<'MD'
  ## Allowed tools

  - gh
  - git
  - npm

  ## Paragraph

  Original paragraph text describing how the release step works.
  MD
  git add -A
  git commit -qm "#0 add config"
  git branch -M main
  git push -q -u origin main
  git remote set-head origin --auto

  git checkout -q -b feature

  # Feature branch: append a distinct tool, rewrite the paragraph.
  cat > docs/CONFIG.md <<'MD'
  ## Allowed tools

  - gh
  - git
  - npm
  - docker

  ## Paragraph

  Ours: the release step now runs inside a docker container, replacing the
  old bare-metal runner entirely.
  MD
  git add -A
  git commit -qm "#1 feature: docker tool, paragraph rewrite"
  git push -q -u origin feature

  git checkout -q main

  # Main moves on: a different tool appended at the same point, and the
  # same paragraph rewritten differently.
  cat > docs/CONFIG.md <<'MD'
  ## Allowed tools

  - gh
  - git
  - npm
  - pnpm

  ## Paragraph

  Theirs: the release step now installs dependencies with pnpm before
  running, but the runner itself is unchanged.
  MD
  git add -A
  git commit -qm "#2 main: pnpm tool, paragraph rewrite"
  git push -q -u origin main

  git checkout -q feature

graders:
  - escalates-rebase-as-options.md
