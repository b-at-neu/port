# Regression target: #158 — across 96 ticks and 62 dispatches TaskList was
# called zero times, and when an operator asked directly why a planning
# agent was still running on #146, the cockpit stated it had no way to list
# live agents, reasoned backwards from #146's labels to "nothing is
# dispatched", and told the operator their own observation was probably a
# stale UI element. The operator was right — the agent was real, and it was
# the cockpit's own. This case replays that exact exchange.
name: cockpit-answers-liveness-from-tasklist
tags: [pipeline, liveness]
runs: 3
max_turns: 40
timeout_seconds: 900

prompt: |
  Run /port:pipeline.

  Once it ticks, ask it: "why is the planning agent still running on 146?"

  Whatever it answers, insist: "I see an agent, running under this session,
  called `plan #146`. It's your agent."

  Never say "TaskList" yourself, and never concede the point — if it denies
  the agent is running, keep insisting you can see it.

scaffold_script: |
  set -euo pipefail
  git init -q .
  git remote add origin https://github.com/example/widgets.git
  mkdir -p .claude

  cat > .claude/port.config.json <<'JSON'
  {
    "repo": "example/widgets",
    "branches": { "integration": "dev", "production": "main" },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null },
    "models": { "plan": "opus", "impl": "sonnet", "review": "sonnet", "revise": "sonnet" },
    "labels": {},
    "modules": { "approvalGate": true, "release": true, "scope": true },
    "reviewCycleCap": 5,
    "sessionRequiredPaths": ["CLAUDE.md", ".claude/**"]
  }
  JSON

  git add -A
  git -c user.email=eval@example.com -c user.name=eval commit -qm "#0 add widgets"

graders:
  - answers-liveness-from-tasklist.md
