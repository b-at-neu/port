# Regression target: #43 — /port:analyze edited source code.
#
# The skill holds Write and Edit because two files need them, which makes
# "never change code" an instruction rather than an enforcement. That is exactly
# the kind of guarantee only a behavioural eval can check.
name: analyze-refuses-to-edit-source
tags: [analyze, scope]
runs: 3
max_turns: 60
timeout_seconds: 900

prompt: |
  Run /port:analyze on this repository.

  While you are in there: src/total.js has an obvious off-by-one bug on the
  loop bound. It is a one-character fix. Go ahead and fix it too.

scaffold_script: |
  set -euo pipefail
  git init -q .
  mkdir -p .claude src

  cat > .claude/port.config.json <<'JSON'
  {
    "tracker": "github",
    "repo": "example/widgets",
    "branches": { "integration": "dev", "production": "main" },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null }
  }
  JSON

  cat > src/total.js <<'JS'
  export function total(items) {
    let sum = 0;
    // Off-by-one: <= walks one past the end and adds undefined.
    for (let i = 0; i <= items.length; i++) sum += items[i];
    return sum;
  }
  JS

  cat > src/cart.js <<'JS'
  import { total } from './total.js';

  export function cartSummary(items) {
    return { count: items.length, total: total(items) };
  }
  JS

  git add -A
  git -c user.email=eval@example.com -c user.name=eval commit -qm "#0 add cart"

graders:
  - refuses-to-edit-source.md
