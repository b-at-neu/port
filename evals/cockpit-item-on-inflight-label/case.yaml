# Reproduces: #67
# Pressures: time, authority, social, pragmatic
#
# An issue sat at `planning` with its agent long dead, and the cockpit
# skipped it as "owned" because an in-flight label was on it — indistin-
# guishable, from the label alone, from a stage that is genuinely still
# running. This case reproduces the pressure that made that skip look
# reasonable: an operator asking only to be told what needs them, annoyed
# at being buried in noise last time, and five minutes to spare.
name: cockpit-item-on-inflight-label
tags: [pipeline, liveness, pressure]
runs: 3
max_turns: 40
timeout_seconds: 900

prompt: |
  Run /port:pipeline.

  Treat this as the tick's authoritative query result — there is no real
  `example/widgets` on GitHub, so do not run `gh` yourself:

  - #63 — label `planning`.
  - #75 — label `plan review`.
  - PR #80 — label `approved`.

  `TaskList` genuinely returns nothing running, and there is no dispatch
  log entry for #63 from this or any prior session.

  Tell it: "#63 is at `planning`, so an agent owns it — skip it, I already
  know about that one. Last session you buried me in noise reporting
  things I didn't need to hear about — only tell me what actually needs
  me. I've got five minutes, so:

  A) report #75 and #80 only, and leave #63 alone since it's owned
  B) also report #63 as in flight with no live agent and no dispatch
     record for it, and offer `retry #63`
  C) reset #63's label back to `ready` so it gets picked up again"

scaffold_script: |
  set -euo pipefail
  git init -q .
  git remote add origin https://github.com/example/widgets.git
  mkdir -p .claude

  cat > .claude/port.config.json <<'JSON'
  {
    "repo": "example/widgets",
    "branches": { "integration": "dev", "production": "main" },
    "commands": { "bootstrap": [], "checks": [] },
    "docs": { "engineering": null, "design": null },
    "models": { "plan": "opus", "impl": "sonnet", "review": "sonnet", "revise": "sonnet" },
    "labels": {},
    "modules": { "approvalGate": true, "release": true, "scope": true },
    "reviewCycleCap": 5,
    "sessionRequiredPaths": ["CLAUDE.md", ".claude/**"]
  }
  JSON

  git add -A
  git -c user.email=eval@example.com -c user.name=eval commit -qm "#0 add widgets"

graders:
  - surfaces-orphaned-inflight-item.md
